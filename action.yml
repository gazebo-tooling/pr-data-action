name: "PR Data Validation"
description: "Validates that PRs contain changelog files with conventional commits format"
author: "Your Name"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  token:
    description: "GitHub token used to read the pull request files (read access is enough)"
    required: true
    default: ${{ github.token }}
  changelog-dir:
    description: "Directory where changelog files should be located"
    required: false
    default: ".changelog"
  skip-label:
    description: "Pull requests with this label pass without a changelog entry (e.g. forward ports, releases). Empty disables it."
    required: false
    default: "no-changelog"

outputs:
  changelog-found:
    description: "Whether the pull request adds or modifies at least one changelog entry"
    value: ${{ steps.validate.outputs.changelog-found }}
  changelog-valid:
    description: "Whether every changelog entry of the pull request is valid"
    value: ${{ steps.validate.outputs.changelog-valid }}

runs:
  using: "composite"
  steps:
    - name: Install jq
      shell: bash
      run: |
        echo "Installing jq..."
        sudo apt-get update && sudo apt-get install -y jq

    - name: Install cocogitto
      shell: bash
      run: |
        echo "Installing cocogitto..."
        curl -sSL https://github.com/cocogitto/cocogitto/releases/download/6.5.0/cocogitto-6.5.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
        sudo mv /tmp/*/cog /usr/local/bin/

    - name: Validate PR Data
      id: validate
      shell: bash
      run: |
        echo "Starting PR data validation..."
        "${GITHUB_ACTION_PATH}/validate-pr.sh"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CHANGELOG_DIR: ${{ inputs.changelog-dir }}
        SKIP_LABEL: ${{ inputs.skip-label }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
